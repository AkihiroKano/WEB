name: Deploy Lab 3 to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'lab-3/package-lock.json'
        
    - name: Install dependencies
      run: cd lab-3 && npm install
      
    - name: Build project
      run: cd lab-3 && npm run build
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './lab-3/dist'
        
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4