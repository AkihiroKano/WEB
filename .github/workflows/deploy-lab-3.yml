name: Deploy Lab 3 to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'lab-3/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'lab-3/package-lock.json'
        
    - name: Install dependencies
      run: cd lab-3 && npm install
      
    - name: Build project
      run: cd lab-3 && npm run build
      
    - name: Setup Pages
      uses: actions/configure-pages@v2
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v1
      with:
        path: ./lab-3/dist
        
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v1